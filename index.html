<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neunundsechzig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#07060f;
  --text:#eef0ff;
  --dim:rgba(238,240,255,.42);
  --faint:rgba(238,240,255,.14);
  --glow:#b9a8ff;
  --pink:#ff8ad8;
  --glass:rgba(12,10,28,.55);
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);color-scheme:dark}
body{
  font-family:var(--sans);font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;
  font-size:15px;overflow:hidden;
}
::selection{background:var(--glow);color:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

#gl{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;
  background:radial-gradient(80% 60% at 60% 40%,#1a1440,#07060f)}
.fx{position:fixed;inset:0;pointer-events:none}
.fx.vig{background:radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(0,0,0,.75))}
.fx.grain{opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.fx.dim{background:rgba(5,4,12,.0);transition:background .8s ease}
body[data-v="member"] .fx.dim{background:rgba(5,4,12,.55)}

.ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:28px 36px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.top .m{color:var(--text);font-weight:600;letter-spacing:.06em;font-size:14px}
.top .m img{display:block;height:48px;width:112px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.keys{display:flex;gap:18px;flex-wrap:wrap}
.keys kbd{font-family:var(--sans);display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-right:6px;
  border:1px solid var(--faint);border-radius:4px;font-size:10px;color:var(--text);letter-spacing:0}

.screen{grid-row:2;align-self:stretch;display:none;opacity:0}
.screen.on{display:flex;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

#s-home{flex-direction:column;justify-content:flex-end;padding-bottom:6vh}
.title{font-weight:800;font-size:clamp(44px,8vw,120px);letter-spacing:-.05em;line-height:.9;
  text-shadow:0 0 40px rgba(185,168,255,.35)}
.title span{display:block;font-weight:300;letter-spacing:-.04em;color:var(--dim)}
.subt{margin-top:14px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

.menu{list-style:none;margin-top:44px;display:grid;gap:4px;width:max-content}
.menu li button{
  position:relative;display:flex;align-items:center;gap:16px;padding:8px 18px 8px 0;
  font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-.02em;color:var(--dim);
  transition:color .2s,transform .25s cubic-bezier(.2,.8,.2,1);
}
.menu li button .ix{font-size:11px;letter-spacing:.1em;font-weight:500;width:22px;opacity:.6}
.menu li button::before{
  content:"";position:absolute;left:-36px;top:50%;width:18px;height:2px;background:var(--text);
  transform:scaleX(0);transform-origin:left;transition:transform .25s;
  box-shadow:0 0 12px var(--glow);
}
.menu li button.sel{color:var(--text);transform:translateX(10px);text-shadow:0 0 18px rgba(185,168,255,.6)}
.menu li button.sel::before{transform:scaleX(1)}
.menu li button .hint{font-size:12px;font-weight:400;letter-spacing:.02em;color:var(--dim);opacity:0;transition:opacity .2s}
.menu li button.sel .hint{opacity:1}

#s-about{align-items:flex-end;padding-bottom:6vh}
#s-about .box{max-width:520px}
.h{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
#s-about p{font-size:clamp(22px,2.4vw,32px);font-weight:400;letter-spacing:-.02em;line-height:1.25}
#s-about p + p{margin-top:16px;font-size:15px;color:var(--dim);letter-spacing:0;line-height:1.6}
.back{margin-top:36px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.back:hover{color:var(--text)}

#s-members{justify-content:flex-end;align-items:center}
.roster{width:min(460px,100%);padding:28px 30px;background:linear-gradient(90deg,transparent,rgba(7,6,15,.55) 30%);border-radius:8px}
.roster .menu{width:100%;margin-top:0;max-height:52vh;overflow-y:auto;scrollbar-width:thin}
.roster .menu li button{width:100%;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--faint)}
.roster .menu li button .l{display:flex;gap:16px;align-items:baseline}
.roster .menu li button .r{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.roster .menu li button.locked{cursor:default}
.roster .menu li button.locked .l span:last-child{letter-spacing:.3em}
.roster .menu li button.sel{transform:none}
.roster .menu li button::before{display:none}
.roster .menu li button.sel .r{color:var(--text)}

#s-member{flex-direction:column;gap:14px;padding-top:6px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh h2{font-size:clamp(28px,4vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.9}
.vh h2 b{font-weight:inherit}
.vh h2 span{font-weight:300;color:var(--dim)}
.acts{display:flex;gap:8px}
.acts > *{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--faint);border-radius:999px;
  background:var(--glass);backdrop-filter:blur(8px);transition:border-color .2s,background .2s}
.acts > *:hover{border-color:var(--text);background:rgba(255,255,255,.08)}
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--faint);border-radius:6px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 120px -30px rgba(120,90,255,.35)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#050410;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);transition:opacity .6s}
.load .bar{width:180px;height:1px;background:var(--faint);position:relative;overflow:hidden}
.load .bar i{position:absolute;inset:0;width:30%;background:var(--text);box-shadow:0 0 10px var(--glow);animation:scan 1.2s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.load.done{opacity:0;pointer-events:none}

@media (max-width:760px){
  .ui{padding:20px}
  .keys{display:none}
  #s-members{justify-content:flex-start;align-items:flex-end;padding-bottom:4vh}
  .roster .menu li button::before{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-v="home">

<canvas id="gl"></canvas>
<div class="fx dim"></div>
<div class="fx vig"></div>
<div class="fx grain"></div>

<div class="ui">
  <div class="top">
    <span class="m"><img src="logo.png" alt="neunundsechzig.swag"></span>
    <span id="loc">main menu</span>
  </div>

  <section class="screen" id="s-home" data-screen="home">
    <h1 class="title">neunund<span>sechzig</span></h1>
    <div class="subt">.swag — est. whenever</div>
    <ul class="menu">
      <li><button data-go="members"><span class="ix">01</span>members<span class="hint">the crew</span></button></li>
      <li id="feat"></li>
      <li><button data-go="about"><span class="ix">03</span>about<span class="hint">what is this</span></button></li>
    </ul>
  </section>

  <section class="screen" id="s-about" data-screen="about">
    <div class="box">
      <div class="h">about</div>
      <p>sie sagt mir fick bitte meine silicon titten.</p>
      <p>photoshop war ein joke, ich war da nicht mal hellwach.</p>
      <button class="back" data-go="home">← back</button>
    </div>
  </section>

  <section class="screen" id="s-members" data-screen="members">
    <div class="roster">
      <div class="h">members</div>
      <ul class="menu">
      </ul>
      <button class="back" data-go="home">← back</button>
    </div>
  </section>

  <section class="screen" id="s-member" data-screen="member">
    <div class="vh">
      <h2><b id="m-name"></b> <span id="m-tag"></span></h2>
      <div class="acts">
        <button data-go="members">back</button>
        <button id="fs">fullscreen</button>
        <a id="m-open" href="#" target="_blank" rel="noopener">open ↗</a>
      </div>
    </div>
    <div class="stage" id="stage">
      <iframe id="embed"
        allow="fullscreen; accelerometer; gyroscope; xr-spatial-tracking; autoplay"
        allowfullscreen></iframe>
      <div class="load" id="load"><span>loading</span><div class="bar"><i></i></div></div>
    </div>
  </section>

  <div class="bottom">
    <div class="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd>select</span>
      <span><kbd>↵</kbd>confirm</span>
      <span><kbd>esc</kbd>back</span>
    </div>
    <span>neunundsechzig © <span id="yr"></span></span>
  </div>
</div>

<script>
const MEMBERS=[
  {name:'okayfwks', tag:'360°', embed:'https://360sona.com/w/k_P0fZ8cOc544CD4wWLE'},
  {name:'ilytrac', tag:'crew'},
];
const FEATURED='okayfwks';
const MIN_SLOTS=3;

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const parent={home:null,about:'home',members:'home',member:'members'};
const labels={home:'main menu',about:'about',members:'members'};
let view='home',current=null;
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const slug=m=>m.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const pad=n=>String(n).padStart(2,'0');

(function build(){
  const ul=$('#s-members .menu');
  MEMBERS.forEach((m,i)=>{
    const li=document.createElement('li');
    const go=m.embed?' data-go="m/'+slug(m)+'"':'';
    li.innerHTML='<button'+go+(m.link&&!m.embed?' data-link="'+esc(m.link)+'"':'')+'><span class="l"><span class="ix">'+pad(i+1)+'</span><span>'+esc(m.name)+'</span></span><span class="r">'+(m.embed?'enter →':m.link?'visit ↗':esc(m.tag||''))+'</span></button>';
    ul.appendChild(li);
  });
  for(let i=MEMBERS.length;i<MIN_SLOTS;i++){
    const li=document.createElement('li');
    li.innerHTML='<button class="locked"><span class="l"><span class="ix">'+pad(i+1)+'</span><span>———</span></span><span class="r">soon</span></button>';
    ul.appendChild(li);
  }
  const f=MEMBERS.find(m=>m.name===FEATURED&&m.embed);
  if(f)$('#feat').innerHTML='<button data-go="m/'+slug(f)+'"><span class="ix">02</span>'+esc(f.name)+'<span class="hint">'+esc(f.tag||'')+'</span></button>';
  else $('#feat').remove();
  $$('#s-home .menu .ix').forEach((e,i)=>e.textContent=pad(i+1));
})();

function items(){return $$('#s-'+view+' .menu button:not(.locked)')}
function select(el){
  $$('#s-'+view+' .menu button').forEach(b=>b.classList.toggle('sel',b===el));
}
function openMember(sl){
  const m=MEMBERS.find(x=>slug(x)===sl&&x.embed);
  if(!m)return false;
  current=m;
  $('#m-name').textContent=m.name;
  $('#m-tag').textContent=m.tag?'/ '+m.tag:'';
  $('#m-open').href=m.embed;
  $('#loc').textContent=m.name;
  const f=$('#embed');
  if(f.getAttribute('src')!==m.embed){
    $('#load').classList.remove('done');
    f.title=m.name;
    f.src=m.embed;
  }
  return true;
}
function show(name){
  let route=name;
  if(name&&name.startsWith('m/')){name=openMember(name.slice(2))?'member':'members'}
  else if(MEMBERS.some(m=>slug(m)===name&&m.embed)){openMember(name);route='m/'+name;name='member'}
  if(!(name in parent))name='home';
  if(name!=='member')route=name;
  view=name;
  document.body.dataset.v=name;
  $$('.screen').forEach(s=>s.classList.toggle('on',s.dataset.screen===name));
  if(labels[name])$('#loc').textContent=labels[name];
  const it=items();if(it.length)select(it[0]);
  if(location.hash.slice(1)!==route)history.replaceState(null,'','#'+route);
  if(window.camGo)camGo(name);
}

document.addEventListener('click',e=>{
  const l=e.target.closest('[data-link]');if(l){window.open(l.dataset.link,'_blank','noopener');return}
  const t=e.target.closest('[data-go]');if(t)show(t.dataset.go);
});
document.addEventListener('mouseover',e=>{const b=e.target.closest('.menu button:not(.locked)');if(b)select(b)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(parent[view])show(parent[view]);return}
  const it=items();if(!it.length)return;
  const i=it.findIndex(b=>b.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();select(it[(i+1)%it.length])}
  else if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();select(it[(i-1+it.length)%it.length])}
  else if(e.key==='Enter'&&i>-1){e.preventDefault();it[i].click()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const cur=view==='member'&&current?'m/'+slug(current):view;if(h!==cur)show(h)});

$('#embed').addEventListener('load',()=>{if($('#embed').getAttribute('src'))$('#load').classList.add('done')});
$('#fs').addEventListener('click',()=>{
  const s=$('#stage');
  if(document.fullscreenElement)document.exitFullscreen();
  else (s.requestFullscreen||s.webkitRequestFullscreen).call(s);
});
$('#yr').textContent=new Date().getFullYear();

(function scene(){
  if(!window.THREE)return;
  const canvas=$('#gl');
  const r=new THREE.WebGLRenderer({canvas,antialias:false});
  r.setPixelRatio(.5);
  const FOG=0x0c0a1e;
  r.setClearColor(FOG);
  const sc=new THREE.Scene();
  sc.fog=new THREE.FogExp2(FOG,.055);
  const cam=new THREE.PerspectiveCamera(55,1,.1,200);

  sc.add(new THREE.AmbientLight(0x4a3f8a,.55));
  const sun=new THREE.DirectionalLight(0x9fb4ff,.9);sun.position.set(-6,10,4);sc.add(sun);
  const pl=new THREE.PointLight(0xff7ad0,2.2,18,1.6);pl.position.set(0,2.2,0);sc.add(pl);

  const g=new THREE.PlaneGeometry(90,90,54,54).toNonIndexed();
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position;
  const hgt=(x,z)=>{
    const d=Math.hypot(x,z);
    const base=Math.sin(x*.21)*Math.cos(z*.17)*1.4+Math.sin(x*.07+z*.11)*2.2;
    return base*Math.min(1,Math.max(0,(d-4)/10))-1.6;
  };
  for(let i=0;i<p.count;i++)p.setY(i,hgt(p.getX(i),p.getZ(i)));
  g.computeVertexNormals();
  const ground=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x2b2560,flatShading:true}));
  sc.add(ground);

  const shard=new THREE.Group();
  const cg=new THREE.OctahedronGeometry(1,0);cg.scale(.8,1.6,.8);
  const core=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0xd9d2ff,emissive:0x5b2a8a,emissiveIntensity:.6,flatShading:true,metalness:.35,roughness:.3}));
  shard.add(core);
  const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,0),new THREE.MeshBasicMaterial({color:0xb9a8ff,wireframe:true,transparent:true,opacity:.18}));
  shard.add(wire);
  const orbit=new THREE.Group();
  const tg=new THREE.TetrahedronGeometry(.18,0);
  const tm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xff7ad0,emissiveIntensity:.5,flatShading:true});
  for(let i=0;i<9;i++){
    const m=new THREE.Mesh(tg,tm);const a=i/9*Math.PI*2;
    m.position.set(Math.cos(a)*3,Math.sin(a*2)*.35,Math.sin(a)*3);
    m.rotation.set(a,a*2,a);orbit.add(m);
  }
  shard.add(orbit);
  shard.position.set(0,1.8,0);
  sc.add(shard);

  const rocks=new THREE.Group();
  const rm=new THREE.MeshLambertMaterial({color:0x3a3278,flatShading:true});
  for(let i=0;i<26;i++){
    const s=.3+Math.random()*1.4;
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rm);
    const a=Math.random()*Math.PI*2,d=7+Math.random()*26;
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    m.position.set(x,hgt(x,z)+s*.3,z);
    m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    rocks.add(m);
  }
  sc.add(rocks);

  const pillarM=new THREE.MeshLambertMaterial({color:0x262058,flatShading:true});
  [[-9,-14,9],[12,-18,13],[-20,-6,7],[18,2,10],[-4,-26,16]].forEach(([x,z,h])=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(.9,1.4,h,5,1),pillarM);
    m.position.set(x,hgt(x,z)+h/2-.5,z);m.rotation.y=Math.random();sc.add(m);
  });

  const N=500,dp=new Float32Array(N*3);
  for(let i=0;i<N;i++){dp[i*3]=(Math.random()-.5)*50;dp[i*3+1]=Math.random()*14-1;dp[i*3+2]=(Math.random()-.5)*50}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
  const dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xcfc6ff,size:.08,transparent:true,opacity:.7}));
  sc.add(dust);

  const shots={
    home:{p:[5.5,2.6,8.5],t:[-1.2,1.6,0]},
    about:{p:[-6,3.4,7],t:[1.5,1.5,0]},
    members:{p:[0.5,1.9,9.5],t:[3.4,1.9,0]},
    member:{p:[0,7,13],t:[0,1,0]}
  };
  const cp=new THREE.Vector3(...shots.home.p),ct=new THREE.Vector3(...shots.home.t);
  const tp=cp.clone(),tt=ct.clone();
  window.camGo=n=>{const s=shots[n]||shots.home;tp.set(...s.p);tt.set(...s.t)};
  camGo(view);

  let mx=0,my=0;
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});

  function size(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
  addEventListener('resize',size);size();

  const clock=new THREE.Clock();
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function loop(){
    const t=clock.getElapsedTime(),k=still?1:.025;
    cp.lerp(tp,k);ct.lerp(tt,k);
    cam.position.set(cp.x+mx*1.2+Math.sin(t*.2)*.4,cp.y-my*.8+Math.sin(t*.3)*.15,cp.z);
    cam.lookAt(ct);
    if(!still){
      core.rotation.y=t*.4;
      shard.position.y=1.8+Math.sin(t*.9)*.18;
      wire.rotation.set(t*.07,-t*.11,0);
      orbit.rotation.y=-t*.35;
      orbit.children.forEach((m,i)=>{m.rotation.x=t+i;m.rotation.y=t*1.3+i});
      dust.rotation.y=t*.01;
      const a=dg.attributes.position.array;
      for(let i=1;i<a.length;i+=3){a[i]+=.004;if(a[i]>13)a[i]=-1}
      dg.attributes.position.needsUpdate=true;
      pl.intensity=2+Math.sin(t*1.7)*.35;
    }
    r.render(sc,cam);
    requestAnimationFrame(loop);
  })();
})();

show(location.hash.slice(1)||'home');
</script>
</body>
</html>
